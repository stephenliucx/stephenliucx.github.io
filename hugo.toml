baseURL = 'https://stephen.period-domain.com/'
locale = 'en-us'
hasCJKLanguage = true
title = "Stephen’s period domain"
theme = 'HugoTeX'
enableInlineShortcodes = true
foornoteReturnLinkContents = "^"
Params.dateformat = "January 2, 2006"

[pagination]
  pagerSize = 3

[Params.author]
  name = "Stephen Liu"
  first_name = "Stephen"
  middle_name = "Sicheng"
  last_name = "Liu"
  name_alt = "劉思承"
  abstract = """
  I'm a fourth year PhD student in math at CUNY Graduate Center, advised by Matthew Stover. My current interest lies in the geometric topology of complex algebraic surfaces. 
  """
  email = "stephen.liu075@gc.cuny.edu"

# [markup.highlight]
#   style = 'dracula'

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[Params.Favicon]
#   ico = "/favicon.ico"                     # Legacy multi-size .ico fallback
#   svg = "/favicon.svg"                     # SVG icon for modern browsers
  png = "/favicon.png"                     # 180x180 PNG fallback and Apple touch icon

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          inline = [['$', '$'], ['\(', '\)']]
          block  = [['$$', '$$'], ['\[', '\]']]
  [markup.highlight]
    style = "paraiso-dark"

[refLinks]
notFoundURLs = "warning"
