<footer>
  <div class="container">
    <p class="credits theme-by">
      {{ if .Site.Params.Legal }}
      <a href="{{ "legal/" | relURL }}">{{ .Site.Params.Legal }}</a>
      <br>
      {{ end }}
      {{ if .Site.Params.PoweredBy }}
      Powered By <a href="https://gohugo.io">Hugo</a>&nbsp;/&nbsp;Theme&nbsp;<a href="https://github.com/hugotex-dev/HugoTeX">HugoTeX</a>
      <br>
      {{ end }}
      <span class="footer-left">
        {{ .Site.Lastmod.Format "2006" }}
        {{ .Site.Params.Author.name }}
      </span>
      <span class="sep">&nbsp; | &nbsp; </span>
      <br class="footer-break">
      <span class="footer-right">{{ .Site.Params.Author.email }}</span>
   </p>
  </div>
</footer>
