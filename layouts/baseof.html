<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
    {{- partial "head.html" . -}}
    {{- if site.Params.darkmode -}}
    <body class="latex-dark{{ if .Params.justify }} text-justify{{ end }}">
    {{- else if site.Params.lightmode -}}
    <body>
    {{- else -}}
    <body class="latex-dark-auto{{ if .Params.justify }} text-justify{{ end }}">
    {{- end -}}
        {{- partial "header.html" . -}}
        <div id="content">
        {{- block "main" . }}{{- end }}
        </div>
        {{- partial "footer.html" . -}}
    </body>
</html>
