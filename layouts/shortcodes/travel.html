{{ $data := index hugo.Data (.Get "data") }}
<div class="travel-list">
  {{ range $data }}
  <ul><li>
   <span class="date">{{ .date }}</span>
    <span class="sep"> | </span>
    {{ .title | markdownify }}, {{ .location | markdownify }} 
    {{ if .other }}
        <br/><span class="other">({{ .other | markdownify }})</span>
    {{ end }} 
  </li></ul>
  {{ end }}
</div>
